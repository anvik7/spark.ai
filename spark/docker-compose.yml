services:
  spark:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      # Uncomment to use the bundled Postgres instead of SQLite:
      # DATABASE_URL: postgresql+psycopg://spark:spark@db:5432/spark
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
